# Infrastructure for local development:
#   docker compose up -d                 -> Postgres, Neo4j, Redis, Kafka
#   docker compose --profile app up -d   -> also runs migrate + ingest + worker + api in containers
name: graphpulse

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: graphpulse
      POSTGRES_PASSWORD: graphpulse
      POSTGRES_DB: graphpulse
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphpulse"]
      interval: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/graphpulse123
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      retries: 20

  # ---- application services (profile "app") ----
  migrate:
    profiles: [app]
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["node", "src/migrate.js"]
    environment: &app-env
      DATABASE_URL: postgres://graphpulse:graphpulse@postgres:5432/graphpulse
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_PASSWORD: graphpulse123
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    depends_on: &infra
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  ingest:
    profiles: [app]
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["node", "src/ingest.js"]
    environment: *app-env
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    profiles: [app]
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["node", "src/worker.js"]
    environment: *app-env
    deploy: { replicas: 2 }
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    profiles: [app]
    build: { context: ., dockerfile: server/Dockerfile }
    command: ["node", "src/api.js"]
    environment: *app-env
    ports: ["4001:4001"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  neo4jdata:
  kafkadata:
